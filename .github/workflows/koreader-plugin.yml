name: KOReader plugin
on:
  push:
    branches: [main]
    paths: ['koreader/**', 'kual/**', 'scriptlet/**', 'tests/**', 'tools/mock/**', '.github/workflows/koreader-plugin.yml']
    # A tag vX.Y.Z is a release: the job at the end publishes what was built.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: A version number to build with, to try an update out. No release is made.
        required: false
permissions:
  contents: read
env:
  KO_VERSION: v2026.07.1
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libsdl2-2.0-0 luajit
          gh release download "$KO_VERSION" -R koreader/koreader -p "koreader-linux-x86_64-$KO_VERSION.tar.xz" -O ko.tar.xz
          mkdir ko && tar xf ko.tar.xz -C ko
          echo "KO_DIR=$(dirname "$(find "$PWD/ko" -maxdepth 3 -name luajit | head -1)")" >> "$GITHUB_ENV"
      - name: Pure Lua tests
        run: YB_CLIENT_ID=test-client luajit tests/lua/run.lua
      - name: Installing an update
        run: sh tests/update/apply_test.sh
      - name: Certificate checks
        run: cd "$KO_DIR" && ./luajit "$GITHUB_WORKSPACE/tests/ko/tls_check.lua" "$GITHUB_WORKSPACE/koreader/yaknigi.koplugin"
      - name: UI against the mock server
        run: tests/ko/run.sh "$KO_DIR" "$PWD/ko-out"
      - name: As a plugin in someone's own KOReader
        run: tests/ko/run.sh "$KO_DIR" "$PWD/ko-out-plugin" plugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ko-out
          path: |
            ko-out/*.png
            ko-out/koreader.log
            ko-out-plugin/*.png
            ko-out-plugin/koreader.log
  package:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the package
        env:
          GH_TOKEN: ${{ github.token }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # A tag decides the version; a build with none has no version and takes no updates.
          version=$INPUT_VERSION
          case "$GITHUB_REF" in refs/tags/*) version=${GITHUB_REF_NAME#v} ;; esac
          if [ -n "$version" ]; then
              echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version: $version"; exit 1; }
          fi
          # The registration at oauth.yandex.ru is not in the repository: without it nobody can sign in.
          test -n "$YANDEX_CLIENT_ID" || { echo "::error::set the secret YANDEX_CLIENT_ID"; exit 1; }
          gh release download "$KO_VERSION" -R koreader/koreader -p "koreader-kindlehf-$KO_VERSION.zip" -O ko.zip
          ext=package/extensions/yaknigi-ko
          mkdir -p "$ext"
          cp kual/yaknigi-ko/* koreader/settings.reader.lua "$ext/"
          unzip -q ko.zip 'koreader/*' -d "$ext"
          cp -R koreader/yaknigi.koplugin "$ext/koreader/plugins/"
          plugin=$ext/koreader/plugins/yaknigi.koplugin
          printf 'return "%s"\n' "$YANDEX_CLIENT_ID" > "$plugin/yaknigi/client_id.lua"
          # The launcher's files go with the plugin, and an update puts them in place (yaknigi/launcher.lua).
          mkdir -p "$plugin/launcher"
          cp kual/yaknigi-ko/run.sh kual/yaknigi-ko/seed.lua kual/yaknigi-ko/apply-update.sh koreader/settings.reader.lua "$plugin/launcher/"
          # What an update cannot bring: KOReader itself. Another one means installing by hand.
          echo "$KO_VERSION" > "$plugin/yaknigi/BASE"
          # The versions before 0.9.11 compare base, which held the launcher's digest then:
          # 0.9.9's, the last one most have, so that they update too.
          legacy_base="$KO_VERSION-a8e7a9bb"
          mkdir -p update
          if [ -n "$version" ]; then
              echo "$version" > "$plugin/yaknigi/VERSION"
              jq --argjson v "[${version//./,}]" '.version = $v' kpm/manifest.json > kpm/manifest.json.new
              mv kpm/manifest.json.new kpm/manifest.json
              tar -C "$ext/koreader/plugins" --owner=0 --group=0 -cf update/yaknigi-update.tar yaknigi.koplugin
              jq -n --arg version "$version" --arg koreader "$KO_VERSION" --arg base "$legacy_base" \
                  --arg sha256 "$(sha256sum update/yaknigi-update.tar | cut -d' ' -f1)" \
                  '{version: $version, koreader: $koreader, base: $base, sha256: $sha256}' > update/manifest.json
              cat update/manifest.json
          fi
          cp LICENSE "$ext/"
          # For those with KOReader of their own: the plugin's folder alone.
          mkdir -p koplugin
          cp LICENSE "$plugin/"
          (cd "$ext/koreader/plugins" && zip -qr "$GITHUB_WORKSPACE/koplugin/yaknigi.koplugin.zip" yaknigi.koplugin -x 'yaknigi.koplugin/launcher/*')
          rm "$plugin/LICENSE"
          du -sh "$ext"
          # Without KUAL, on the newer jailbreaks: a scriptlet is shown among the books.
          mkdir -p package/documents
          cp scriptlet/yaknigi.sh package/documents/
      - name: Build the KPM package
        run: |
          kpm=kpm-package
          mkdir -p "$kpm/scriptlets" kpkg
          cp kpm/* "$kpm/"
          cp scriptlet/yaknigi.sh "$kpm/scriptlets/"
          cp -R package/extensions/yaknigi-ko "$kpm/yaknigi-ko"
          (cd "$kpm" && tar -czf ../kpkg/yaknigi-ko_kindlehf.kpkg *)
          tar -tzf kpkg/yaknigi-ko_kindlehf.kpkg | grep -v '^yaknigi-ko/'
      - uses: actions/upload-artifact@v4
        with:
          name: yaknigi-ko-kindlehf
          path: package
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yaknigi-ko-kpkg
          path: kpkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yaknigi-koplugin
          path: koplugin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yaknigi-update
          path: update
          if-no-files-found: ignore
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd yaknigi-ko-kindlehf && zip -qr ../yaknigi-ko-kindlehf.zip .)
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              yaknigi-update/manifest.json yaknigi-update/yaknigi-update.tar \
              yaknigi-ko-kindlehf.zip yaknigi-ko-kpkg/yaknigi-ko_kindlehf.kpkg \
              yaknigi-koplugin/yaknigi.koplugin.zip
